<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <style>
    :root { --primary-color: #6366f1; --bg-color: #f8fafc; }
    body { background-color: var(--bg-color); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 40px; }
    .header-section { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; padding: 30px; border-radius: 0 0 25px 25px; }
    .main-card { background: white; border-radius: 20px; padding: 24px; margin-top: -30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .item-row { border: 1px solid #f1f5f9; padding: 15px; margin-bottom: 15px; border-radius: 12px; background: #fff; }
    .sig-wrapper { border: 2px solid #f1f5f9; background: #fff; border-radius: 16px; height: 180px; position: relative; }
    #padPIC { width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .section-title { font-weight: 700; color: var(--primary-color); margin-bottom: 12px; font-size: 0.8rem; text-transform: uppercase; }
  </style>
</head>
<body>

<div class="header-section text-center">
  <h4 class="fw-bold m-0">PIC LINE INPUT</h4>
  <p class="small opacity-75 m-0">Input Menu Test Food</p>
</div>

<div class="container mt-2">
  <div class="alert alert-warning py-2 px-3 mb-0" style="border-radius: 12px; border: none; background-color: #fff3cd; color: #856404;">
    <div class="d-flex align-items-center">
      <span style="font-size: 1.2rem; margin-right: 10px;">⚠️</span>
      <small class="fw-bold" style="line-height: 1.2;">
        Jika terdapat error saat input item, harap <u>reload/segarkan</u> halaman web terlebih dahulu.
      </small>
    </div>
  </div>
</div>

<div class="container">
  <div class="main-card">
    <div class="row g-2 mb-3">
      <div class="col-6"><label class="small fw-bold">Tanggal</label><input type="date" id="tanggal" class="form-control"></div>
      <div class="col-6"><label class="small fw-bold">Shift</label><select id="shiftPic" class="form-select"><option value="PAGI">PAGI</option><option value="SORE">SORE</option></select></div>
    </div>
    <div class="mb-3">
      <label class="small fw-bold">Nama PIC (Contoh: Budi-Sushi)</label>
      <input type="text" id="namaPic" class="form-control" placeholder="Nama-Divisi">
    </div>

    <div class="section-title">Daftar Menu</div>
    <div id="item-container"></div>
    <button class="btn btn-outline-secondary btn-sm w-100 mb-4" onclick="addItem()">+ Tambah Counter</button>

    <div class="section-title">E-Signature</div>
    <div class="sig-wrapper" onclick="openSignatureModal()" style="cursor: pointer; display: flex; align-items: center; justify-content: center;">
      <span id="sigPlaceholder" class="text-muted small">Tap untuk tanda tangan</span>
      <canvas id="padPIC" style="display: none;"></canvas>
    </div>
    <div class="text-end mb-3"><button class="btn btn-sm btn-link text-danger" onclick="clearSignature()">Clear</button></div>
    
    <button class="btn btn-primary w-100 py-3 fw-bold shadow" id="btnSimpan" onclick="simpanData()">SIMPAN DATA</button>
  </div>
</div>

<script>
  let MASTER_PRODUK = {};
  const canvas = document.getElementById('padPIC');
  // Perbaikan inisialisasi agar HD dan tidak buram
  const signaturePad = new SignaturePad(canvas, { 
    backgroundColor: 'rgb(255, 255, 255)',
    penColor: 'rgb(0, 0, 0)',
    minWidth: 2,
    maxWidth: 4
  });

  function resizeCanvas() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    canvas.getContext("2d").scale(ratio, ratio);
    signaturePad.clear(); 
  }

  window.addEventListener("resize", resizeCanvas);

  window.onload = async () => {
    resizeCanvas();
    // Memanggil data master produk agar dropdown muncul
    try {
      const res = await fetch('/api/products');
      MASTER_PRODUK = await res.json();
      addItem();
    } catch (err) {
      console.error('Gagal ambil master:', err);
    }
  };

  function productDropdownHtml(cat, exclude = [], keep = '') {
    const used = new Set(exclude.map(v => String(v).trim().toLowerCase()));
    if (keep) used.delete(String(keep).trim().toLowerCase());
    const sortedSub = (MASTER_PRODUK[cat] || []).sort().filter(p => !used.has(String(p).trim().toLowerCase()));
    return `
      <select class="form-select form-select-sm product-select" onchange="updateByProduct(this)">
        <option value="">-- Pilih Produk ${cat} --</option>
        ${sortedSub.map(p => `<option value="${p}"${p === keep ? ' selected' : ''}>${p}</option>`).join('')}
        <option value="MANUAL" style="font-weight:bold; color:blue;">[ + ] INPUT MANUAL</option>
      </select>`;
  }

  function selectedInCard(row) {
    const vals = [];
    row.querySelectorAll('.product-select').forEach(s => {
      if (s.value && s.value !== 'MANUAL') vals.push(s.value);
    });
    row.querySelectorAll('.product-manual').forEach(i => {
      if (i.value.trim()) vals.push(i.value.trim());
    });
    return vals;
  }

  function refreshCardDropdowns(row) {
    const cat = row.querySelector('.counter-select').value;
    if (!cat || cat === 'OTHERS') return;
    const used = selectedInCard(row);
    row.querySelectorAll('.product-slot').forEach(slot => {
      const sel = slot.querySelector('.product-select');
      if (!sel) return;
      const cur = (sel.value && sel.value !== 'MANUAL') ? sel.value : '';
      const tmp = document.createElement('div');
      tmp.innerHTML = productDropdownHtml(cat, used, cur);
      sel.replaceWith(tmp.firstElementChild);
    });
  }

  function addItem() {
    const container = document.getElementById('item-container');
    const itemCount = container.querySelectorAll('.item-row').length + 1; // Penomoran
    const div = document.createElement('div');
    div.className = 'item-row shadow-sm';

    const sortedCounters = Object.keys(MASTER_PRODUK).sort();

    div.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="badge bg-primary">COUNTER #${itemCount}</span>
        <a href="javascript:void(0)" class="text-danger small" onclick="removeItem(this)">✖ Hapus</a>
      </div>
      <div class="mb-2">
        <label class="small fw-bold text-muted" style="font-size: 10px;">PILIH COUNTER</label>
        <select class="form-select form-select-sm counter-select" onchange="updateByCounter(this)">
          <option value="" disabled selected>-- Pilih --</option>
          ${sortedCounters.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select>
      </div>
      <div class="mb-1">
        <label class="small fw-bold text-muted" style="font-size: 10px;">DAFTAR PRODUK</label>
        <div class="product-slots"></div>
        <button type="button" class="btn btn-outline-secondary btn-sm w-100 mt-2 add-product-btn" onclick="addProductSlot(this)">+ Tambah Produk</button>
      </div>
    `;
    container.appendChild(div);
  }

function removeItem(el) {
    el.closest('.item-row').remove();
    // Re-index nomor setelah dihapus
    document.querySelectorAll('#item-container .badge').forEach((badge, index) => {
      badge.innerText = 'COUNTER #' + (index + 1);
    });
  }

  function updateByCounter(el) {
    const row = el.closest('.item-row');
    const slots = row.querySelector('.product-slots');
    const cat = el.value;
    slots.innerHTML = '';
    addProductSlot(row.querySelector('.add-product-btn'));
  }

  function addProductSlot(btn) {
    const row = btn.closest('.item-row');
    const cat = row.querySelector('.counter-select').value;
    if (!cat) return alert('Pilih counter dulu!');
    const slots = row.querySelector('.product-slots');
    const slot = document.createElement('div');
    slot.className = 'product-slot input-group input-group-sm mb-1';
    if (cat === "OTHERS") {
      slot.innerHTML = `<input type="text" class="form-control product-manual" placeholder="Ketik Nama Produk...">
        <button class="btn btn-outline-danger" type="button" onclick="removeProductSlot(this)">✖</button>`;
    } else {
      slot.innerHTML = `${productDropdownHtml(cat, selectedInCard(row))}
        <button class="btn btn-outline-danger" type="button" onclick="removeProductSlot(this)">✖</button>`;
    }
    slots.appendChild(slot);
    refreshCardDropdowns(row);
  }

  function removeProductSlot(btn) {
    const row = btn.closest('.item-row');
    btn.closest('.product-slot').remove();
    refreshCardDropdowns(row);
  }

  function updateByProduct(el) {
    const row = el.closest('.item-row');
    if (el.value !== "MANUAL") {
      refreshCardDropdowns(row);
      return;
    }
    const slot = el.closest('.product-slot');
    slot.innerHTML = `<input type="text" class="form-control product-manual" placeholder="Nama menu..." oninput="refreshCardDropdowns(this.closest('.item-row'))">
      <button class="btn btn-outline-secondary" type="button" onclick="cancelManual(this)">✖</button>`;
    refreshCardDropdowns(row);
  }

  function cancelManual(btn) {
    const row = btn.closest('.item-row');
    const cat = row.querySelector('.counter-select').value;
    const slot = btn.closest('.product-slot');
    if (cat === "OTHERS" || !cat) {
      slot.innerHTML = `<input type="text" class="form-control form-control-sm product-manual" placeholder="Ketik Nama Produk...">
        <button class="btn btn-outline-danger" type="button" onclick="removeProductSlot(this)">✖</button>`;
    } else {
      slot.innerHTML = `${productDropdownHtml(cat, selectedInCard(row))}
        <button class="btn btn-outline-danger" type="button" onclick="removeProductSlot(this)">✖</button>`;
    }
    refreshCardDropdowns(row);
  }

  async function simpanData() {
    const items = [];
    document.querySelectorAll('.item-row').forEach(row => {
      const c = row.querySelector('.counter-select').value;
      if (!c) return;
      row.querySelectorAll('.product-slot').forEach(slot => {
        const selectObj = slot.querySelector('.product-select');
        const manualObj = slot.querySelector('.product-manual');
        let n = "";
        if (manualObj) n = manualObj.value.trim();
        else if (selectObj) n = selectObj.value;

        if (n && n !== "MANUAL") items.push({ counter: c, nama: n });
      });
    });

    const seen = new Set();
    const dupe = items.find(it => {
      const k = `${it.counter}||${it.nama.trim().toLowerCase()}`;
      if (seen.has(k)) return true;
      seen.add(k);
      return false;
    });
    if (dupe) return alert(`⚠️ Produk duplikat di counter ${dupe.counter}: "${dupe.nama}"`);

    if(!items.length || signaturePad.isEmpty() || !document.getElementById('namaPic').value || !document.getElementById('tanggal').value) return alert("⚠️ Lengkapi data!");

    const btn = document.getElementById('btnSimpan');
    btn.disabled = true; btn.innerHTML = "⌛ Menyimpan...";

    try {
      const res = await fetch('/api/pic', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tanggal: document.getElementById('tanggal').value,
          waktu: document.getElementById('shiftPic').value,
          nama: document.getElementById('namaPic').value,
          sigData: signaturePad.toDataURL(),
          items: items
        })
      }).then(r => r.json());

      alert(res);
      if (res.includes && res.includes("Berhasil")) location.reload();
      else { btn.disabled = false; btn.innerHTML = "SIMPAN DATA"; }
    } catch (err) {
      alert("❌ Error: " + err.toString());
      btn.disabled = false; btn.innerHTML = "SIMPAN DATA";
    }
  }
</script>

<!-- Modal Signature Popup -->
<div class="modal fade" id="signatureModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius: 16px;">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title fw-bold">Tanda Tangan PIC</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body d-flex justify-content-center">
        <canvas id="padPICModal" width="300" height="300" style="border: 2px solid #e2e8f0; border-radius: 12px; background: #fff; touch-action: none; cursor: crosshair;"></canvas>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-danger btn-sm" onclick="clearModalSignature()">Clear</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="saveModalSignature()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let modalSignaturePad = null;
  
  function openSignatureModal() {
    const modal = new bootstrap.Modal(document.getElementById('signatureModal'));
    modal.show();
    
    setTimeout(() => {
      const modalCanvas = document.getElementById('padPICModal');
      modalSignaturePad = new SignaturePad(modalCanvas, {
        backgroundColor: 'rgb(255, 255, 255)',
        penColor: 'rgb(0, 0, 0)',
        minWidth: 2,
        maxWidth: 4
      });
    }, 100);
  }
  
  function clearModalSignature() {
    if (modalSignaturePad) modalSignaturePad.clear();
  }
  
  function saveModalSignature() {
    if (!modalSignaturePad || modalSignaturePad.isEmpty()) {
      alert('Tanda tangan masih kosong!');
      return;
    }
    
    const dataUrl = modalSignaturePad.toDataURL();
    signaturePad.fromDataURL(dataUrl);
    
    document.getElementById('padPIC').style.display = 'block';
    document.getElementById('sigPlaceholder').style.display = 'none';
    
    bootstrap.Modal.getInstance(document.getElementById('signatureModal')).hide();
  }
  
  function clearSignature() {
    signaturePad.clear();
    document.getElementById('padPIC').style.display = 'none';
    document.getElementById('sigPlaceholder').style.display = 'block';
  }
</script>

</body>
</html>
