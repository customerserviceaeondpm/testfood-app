<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --aeon-magenta: #bc005b; }
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 40px; margin: 0; }
    .header { background: var(--aeon-magenta); color: white; padding: 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .main-card { background: white; border-radius: 16px; padding: 20px; margin: 16px auto; max-width: 960px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .login-wrapper { max-width: 400px; margin: 80px auto; padding: 24px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .table-responsive { max-height: 500px; overflow-y: auto; }
    pre { font-size: 11px; background: #f1f5f9; padding: 6px; border-radius: 6px; margin: 0; max-width: 250px; overflow-x: auto; }
  </style>
</head>
<body>

<div id="loginScreen" class="login-wrapper">
  <h4 class="fw-bold mb-3 text-center" style="color: var(--aeon-magenta);">ADMIN DATABASE</h4>
  <p class="text-muted small text-center mb-4">Masukkan NIK untuk mengakses kontrol database.</p>
  <div class="mb-3">
    <label class="small fw-bold">Nomor Induk Karyawan (NIK)</label>
    <input type="password" id="nikInput" class="form-control" placeholder="Masukkan NIK...">
  </div>
  <button class="btn w-100 fw-bold text-white" style="background: var(--aeon-magenta);" onclick="loginAdmin()">MASUK</button>
  <div id="loginError" class="text-danger small mt-2 text-center"></div>
</div>

<div id="appScreen" style="display: none;">
  <div class="header d-flex justify-content-between align-items-center">
    <h6 class="m-0 fw-bold">DATABASE CONTROL PANEL</h6>
    <div>
      <a href="/dashboard.html" class="btn btn-sm btn-light me-2">Dashboard</a>
      <button class="btn btn-sm btn-outline-light" onclick="logout()">Keluar</button>
    </div>
  </div>

  <div class="container-fluid px-3">
    <div class="main-card">
      <ul class="nav nav-tabs mb-3" id="adminTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-table="pic_submissions" onclick="switchTable('pic_submissions')">PIC Submissions</button></li>
        <li class="nav-item"><button class="nav-link" data-table="test_food_records" onclick="switchTable('test_food_records')">Test Food Records</button></li>
        <li class="nav-item"><button class="nav-link" data-table="tester_drafts" onclick="switchTable('tester_drafts')">Tester Drafts</button></li>
        <li class="nav-item"><button class="nav-link" data-table="generated_reports" onclick="switchTable('generated_reports')">Generated Reports</button></li>
      </ul>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex gap-2">
          <input type="date" id="filterTanggal" class="form-control form-control-sm" onchange="loadTableData()">
          <select id="filterWaktu" class="form-select form-select-sm" onchange="loadTableData()">
            <option value="">Semua Shift</option>
            <option value="PAGI">PAGI</option>
            <option value="SORE">SORE</option>
          </select>
          <button class="btn btn-sm btn-secondary" onclick="resetFilter()">Reset</button>
        </div>
        <button class="btn btn-sm btn-outline-primary" onclick="loadTableData()">🔄 Refresh</button>
      </div>

      <div id="tableContainer" class="table-responsive">
        <div class="text-center p-4 text-muted">Memuat data...</div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="jsonModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius: 16px;">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title fw-bold">Detail JSON / Data</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <pre id="jsonModalContent" style="max-height: 400px; font-size: 12px;"></pre>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let currentTable = 'pic_submissions';
  let token = sessionStorage.getItem('adminToken');

  window.onload = () => {
    if (token) {
      showApp();
    }
  };

  async function loginAdmin() {
    const nik = document.getElementById('nikInput').value.trim();
    if (!nik) return;
    const errEl = document.getElementById('loginError');
    errEl.innerText = '';
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nik })
      }).then(r => r.json());

      if (res.success) {
        token = res.token;
        sessionStorage.setItem('adminToken', token);
        showApp();
      } else {
        errEl.innerText = 'NIK tidak valid.';
      }
    } catch (e) {
      errEl.innerText = 'Error koneksi.';
    }
  }

  function logout() {
    sessionStorage.removeItem('adminToken');
    token = null;
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('nikInput').value = '';
  }

  function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    loadTableData();
  }

  function switchTable(table) {
    currentTable = table;
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-table="${table}"]`).classList.add('active');
    loadTableData();
  }

  function resetFilter() {
    document.getElementById('filterTanggal').value = '';
    document.getElementById('filterWaktu').value = '';
    loadTableData();
  }

  async function loadTableData() {
    const tanggal = document.getElementById('filterTanggal').value;
    const waktu = document.getElementById('filterWaktu').value;
    let url = `/api/admin/${currentTable}?limit=100`;
    if (tanggal) url += `&tanggal=${tanggal}`;
    if (waktu) url += `&waktu=${waktu}`;

    const container = document.getElementById('tableContainer');
    container.innerHTML = '<div class="text-center p-4 text-muted"><div class="spinner-border spinner-border-sm"></div> Memuat...</div>';

    try {
      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(r => r.json());

      if (!res.success) {
        if (res.message === 'Unauthorized') {
          logout();
          return;
        }
        container.innerHTML = `<div class="text-danger p-3 text-center">${res.message}</div>`;
        return;
      }

      renderTable(res.data, res.count);
    } catch (e) {
      container.innerHTML = `<div class="text-danger p-3 text-center">Gagal memuat data.</div>`;
    }
  }

  const DATE_COLS = ['updated_at', 'created_at', 'submitted_at'];

  function formatJakarta(val) {
    if (!val) return '<span class="text-muted">-</span>';
    try {
      const d = new Date(val);
      if (isNaN(d.getTime())) return String(val);
      return d.toLocaleString('id-ID', {
        timeZone: 'Asia/Jakarta',
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      }).replace(',', '') + ' WIB';
    } catch {
      return String(val);
    }
  }

  function renderTable(rows, totalCount) {
    const container = document.getElementById('tableContainer');
    if (!rows || rows.length === 0) {
      container.innerHTML = '<div class="text-center p-4 text-muted">Tidak ada data.</div>';
      return;
    }

    const cols = Object.keys(rows[0]);
    let html = `<div class="small text-muted mb-2">Total baris: <b>${totalCount}</b></div><table class="table table-sm table-bordered table-striped" style="font-size:12px;"><thead><tr>`;
    cols.forEach(c => html += `<th>${c}</th>`);
    html += `<th>Aksi</th></tr></thead><tbody>`;

    rows.forEach(r => {
      html += `<tr>`;
      cols.forEach(c => {
        let val = r[c];
        if (typeof val === 'object' && val !== null) {
          val = `<button class="btn btn-xs btn-outline-secondary py-0 px-1" style="font-size:10px;" onclick='showJson(${JSON.stringify(JSON.stringify(val))})'>Lihat JSON</button>`;
        } else if (c === 'signature_url' && typeof val === 'string' && val.startsWith('http')) {
          val = `<a href="${val}" target="_blank"><img src="${val}" style="height:48px;max-width:120px;object-fit:contain;background:#fff;border:1px solid #e2e8f0;border-radius:6px;" loading="lazy" onerror="this.outerHTML='<a href=&quot;${val}&quot; target=&quot;_blank&quot; style=&quot;font-size:11px;&quot;>Buka Link</a>'"></a>`;
        } else if (typeof val === 'string' && val.startsWith('http')) {
          val = `<a href="${val}" target="_blank" style="font-size:11px;">Buka Link</a>`;
        } else if (DATE_COLS.includes(c)) {
          val = formatJakarta(val);
        } else if (val === null) {
          val = '<span class="text-muted">-</span>';
        } else {
          val = String(val);
          if (val.length > 50) val = val.slice(0, 50) + '...';
        }
        html += `<td>${val}</td>`;
      });
      html += `<td><button class="btn btn-danger btn-xs py-0 px-1" style="font-size:10px;" onclick="deleteRow(${r.id})">Hapus</button></td>`;
      html += `</tr>`;
    });

    html += `</tbody></table>`;
    if (currentTable === 'test_food_records') {
      html += `<div class="mt-3 border-top pt-2"><button class="btn btn-sm btn-outline-danger" onclick="deleteShiftData()">🗑️ Hapus Semua Record Tanggal & Shift Terfilter</button></div>`;
    }
    container.innerHTML = html;
  }

  function showJson(str) {
    try {
      const obj = JSON.parse(str);
      document.getElementById('jsonModalContent').innerText = JSON.stringify(obj, null, 2);
    } catch {
      document.getElementById('jsonModalContent').innerText = str;
    }
    new bootstrap.Modal(document.getElementById('jsonModal')).show();
  }

  async function deleteRow(id) {
    if (!confirm('Yakin ingin menghapus baris ini?')) return;
    try {
      const res = await fetch(`/api/admin/${currentTable}?id=${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(r => r.json());
      if (res.success) {
        loadTableData();
      } else {
        alert('Gagal menghapus: ' + res.message);
      }
    } catch {
      alert('Error koneksi.');
    }
  }

  async function deleteShiftData() {
    const tanggal = document.getElementById('filterTanggal').value;
    const waktu = document.getElementById('filterWaktu').value;
    if (!tanggal || !waktu) {
      alert('Pilih Tanggal dan Shift terlebih dahulu untuk penghapusan massal.');
      return;
    }
    if (!confirm(`Yakin hapus semua record test food tanggal ${tanggal} shift ${waktu}?`)) return;

    try {
      const res = await fetch(`/api/admin/test_food_records?tanggal=${tanggal}&waktu=${waktu}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(r => r.json());
      if (res.success) {
        alert('Berhasil dihapus.');
        loadTableData();
      } else {
        alert('Gagal: ' + res.message);
      }
    } catch {
      alert('Error koneksi.');
    }
  }
</script>
</body>
</html>
